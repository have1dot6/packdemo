on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: have1dot6/nebula-actions/setup-nebula@latest
        with:
          auth-token: ${{ secrets.NPM_TOKEN }}
      - uses: have1dot6/nebula-actions/setup-android@latest
        with:
          release-tag: v1.0.0
          debug: 'true'