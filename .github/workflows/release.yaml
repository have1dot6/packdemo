name: Release
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: have1dot6/nebula-actions/setup-nebula@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          registry-token: ${{ secrets.NPM_TOKEN }}
      - uses: have1dot6/nebula-actions/setup-android@main
        with:
          release-tag: v1.0.0
          debug: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-repo: ${{ github.repository }}