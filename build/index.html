<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite Docs Example - Nebula Pack</title>
  <meta name="description" content="Vite 文档站点示例 - 使用 Nebula Pack 打包为多平台应用" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      color: #2c3e50;
    }
    
    #app {
      min-height: 100vh;
    }
    
    /* 加载动画 */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: #666;
      font-size: 1rem;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-ByFUbHQZ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CctP-7gO.css">
</head>
<body>
  <div id="app">
    <!-- 加载时显示的内容 -->
    <div class="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">正在加载 Nebula Pack 示例应用...</div>
    </div>
  </div>
</body>
</html>
